<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TVN Insight</title><meta name="robots" content="noindex"><meta name="theme-color" content="#16294A"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0E1524;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;box-sizing:border-box;height:calc(50px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:#16294A;border-bottom:1px solid rgba(227,192,112,.35);display:flex;align-items:center;gap:8px;font:600 15px "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar a{display:inline-flex;align-items:center;gap:4px;min-height:44px;box-sizing:border-box;color:#E3C070;text-decoration:none;font-weight:700;padding:10px 8px;border-radius:10px;white-space:nowrap}
.bar a:focus-visible{outline:2px solid #E3C070}
.bar span{color:#fff;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar small{margin-left:auto;color:#AEB9CF;font-weight:500;font-size:12px;white-space:nowrap}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(50px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 50px - env(safe-area-inset-top,0px));border:0;background:#fff}
.err{color:#E7ECF5;font:500 15px system-ui,sans-serif;padding:80px 20px;text-align:center}.err a{color:#E3C070}
#tvnqa-b{display:none!important}
.bar a.dl{margin-left:6px;font-weight:600;font-size:13px;color:#AEB9CF;padding:10px 6px}
#v{position:fixed;left:0;right:0;bottom:0;top:calc(50px + env(safe-area-inset-top,0px));overflow:auto;-webkit-overflow-scrolling:touch;background:#5B6579;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#v img,#v canvas{display:block;width:calc(100% - 12px);max-width:1000px;height:auto;margin:0 auto 8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
#v .msg{color:#E7ECF5;font:500 14px system-ui,sans-serif;text-align:center;padding:40px 16px}#v .msg a{color:#E3C070}
</style></head><body>
<div class="bar"><a href="../v2/" id="back">‹ Quay lại</a><span id="t"></span><small id="s"></small><a class="dl" id="dl" hidden>Tải về</a></div>
<iframe id="f" title="Nội dung" allow="fullscreen; clipboard-write; autoplay"></iframe>
<script>
(function(){
  /* Trang mở riêng cho các phần nằm ngoài TVN Insight (Vĩ mô, Hub) và bản đầy đủ của bản tin: luôn có "‹ TVN Insight" để quay về. */
  var th = "light"; try { var x = localStorage.getItem("tvn-theme") || localStorage.getItem("tvn_dash_theme"); if (x === "dark" || (x !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) th = "dark"; } catch (e) { }
  var P = {
    vimo: ["/vimo/", "Vĩ mô"],
    hamy: ["/tvn-hub/?embed=1&khoi=hamy,cs&theme=" + th, "Hàm ý & chính sách"],
    baocao: ["/tvn-hub/?embed=1&khoi=bc&theme=" + th, "Báo cáo"],
    thucthi: ["/tvn-hub/?embed=1&khoi=run&theme=" + th, "🔎 Cào tin & phân tích"],
    bando: ["/tvn-hub/thegioi/#ban-do", "Thế giới → Việt Nam · bản đồ"]
  };
  var q = new URLSearchParams(location.search), k = q.get("p") || "", x = P[k], f = document.getElementById("f");
  if (k === "doc") {   /* bản đầy đủ của một số bản tin: chỉ nhận đường dẫn trong trang này */
    var d = q.get("f") || "";
    if (/^(sang|phien|tuan|a\/[0-9]{8}-(sang|phien|tuan))\/[a-z0-9_]+\.(html|pdf|png|jpe?g)$/.test(d)) x = ["../" + d, q.get("n") || "Bản tin"];
  }
  /* 14/11/2026 (anh Vũ: mở PDF, ảnh của bản tin xong không về được TVN Insight): PDF và ảnh mở trong khung này, có nút Quay lại về đúng màn trước.
     b = màn trước của TVN Insight (#bantin/...), chỉ nhận chuỗi an toàn. */
  var bk = q.get("b") || "", back = document.getElementById("back");
  if (/^#[A-Za-z0-9_\/?=&%.-]{0,160}$/.test(bk)) back.href = "../v2/" + bk;
  if (k === "thucthi") {   /* 24/10: nút "Cào tin" trên thẻ mã, mục Thị trường truyền sẵn loại phiếu và mã sang Hub */
    ["the", "ma", "q"].forEach(function (n) { var v = (q.get(n) || "").slice(0, 120); if (v) x = [x[0] + "&" + n + "=" + encodeURIComponent(v), x[1]]; });
  }
  if (!x) { f.remove(); document.body.insertAdjacentHTML("beforeend", '<p class="err">Không tìm thấy trang này. <a href="../">Về TVN Insight</a></p>'); return; }
  document.getElementById("t").textContent = x[1]; document.getElementById("s").textContent = q.get("d") || "";
  document.title = x[1] + " · TVN Insight"; f.title = x[1];
  var loai = (/\.(pdf|png|jpe?g)$/.exec(x[0]) || [])[1];
  if (!loai) f.src = x[0];
  else {
    var dl = document.getElementById("dl"); dl.href = x[0]; dl.setAttribute("download", ""); dl.hidden = false;
    f.remove(); var v = document.createElement("div"); v.id = "v"; document.body.appendChild(v);
    var loi = function () { v.innerHTML = '<p class="msg">Không hiển thị được tệp ngay trong trang. <a href="' + x[0] + '">Mở tệp</a> · <a href="' + back.href + '">Về TVN Insight</a></p>'; };
    if (loai !== "pdf") { var im = new Image(); im.alt = x[1]; im.onerror = loi; im.src = x[0]; v.appendChild(im); }
    else {
      v.innerHTML = '<p class="msg">Đang mở PDF…</p>';
      var sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onerror = loi;
      sc.onload = function () {
        var L = window.pdfjsLib; if (!L) return loi();
        L.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        L.getDocument(x[0]).promise.then(function (pdf) {
          v.innerHTML = ""; var w = Math.min(v.clientWidth - 12, 1000), r = Math.min(window.devicePixelRatio || 1, 2), n = 0;
          (function trang() {
            if (++n > pdf.numPages) return;
            pdf.getPage(n).then(function (pg) {
              var vp = pg.getViewport({ scale: w / pg.getViewport({ scale: 1 }).width * r }), c = document.createElement("canvas");
              c.width = vp.width; c.height = vp.height; c.setAttribute("aria-label", "Trang " + n); v.appendChild(c);
              pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(trang, trang);
            }, loi);
          })();
        }, loi);
      };
      document.head.appendChild(sc);
    }
  }
  /* nếu người đọc mở thẳng trang này rồi bấm quay về thì về đúng mục đã mở */
  document.getElementById("back").addEventListener("click", function (e) { if (history.length > 1 && document.referrer && new URL(document.referrer).pathname.indexOf("/bantin/") === 0 && !/\/xem\//.test(document.referrer)) { e.preventDefault(); history.back(); } });
})();
</script>
<!--tvn-brand--><!--tvn-qa--><script defer src="../qa/qa.js"></script></body></html>
