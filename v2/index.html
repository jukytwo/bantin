        (done.length ? '<div class="qi"><span class="e" aria-hidden="true">🗂</span><div><b>' + done.length + " vị thế đã đóng:</b> " + dW + " có lãi (" + num(dW / done.length * 100) + "%), bình quân " + (bqD == null ? "–" : sg(bqD, 2) + "%") + ".</div></div>" : "") +
        (k.ok_t2 ? '<div class="qi"><span class="e" aria-hidden="true">✅</span><div><b>Đúng hướng sau T+2:</b> ' + k.ok_t2[0] + "/" + k.ok_t2[1] + " vị thế (cả đã đóng và đang mở).</div></div>" : "") +
        '<div class="sm" style="margin-top:8px"><b>Nắm giữ</b> = giữ phần đang có; điểm mua mới xem TVN-Trading.</div>' +   /* V3: một dòng, đặt một lần; không ghi bậc TVN-Trading từng mã (gói VIP) */
        '<div class="sm mute" style="margin-top:6px">Giá đóng cửa tới ' + esc(dmy(D.updated_px || D.updated)) + "</div></section>";
      /* C3c: đường danh mục so VN-Index, ngay dưới Đọc nhanh (dm.json › chart, gốc 100) */
      var CHd = D.chart;
      if (CHd && CHd.days && CHd.days.length > 1) h += '<section class="card"><div class="row"><span class="lab">Danh mục khuyến nghị so VN-Index</span><span class="sm mute">gốc 100 ngày ' + esc(dmy(CHd.days[0])) + "</span></div>" + chBox({ alt: "Danh mục khuyến nghị so với VN-Index", h: 180, yf: function (v) { return num(v, 0); }, x: CHd.days, lines: [{ v: CHd.vni, cls: "ln" }, { v: CHd.port, cls: "ln2" }] }) +
        '<div class="chl"><span><i style="background:var(--gold)"></i>Danh mục ' + num(CHd.port[CHd.port.length - 1], 2) + '</span><span><i style="background:var(--navy)"></i>VN-Index ' + num(CHd.vni[CHd.vni.length - 1], 2) + "</span></div></section>";
      var px = function (v) { return v == null || v === "" ? "–" : typeof v === "number" ? num(v * 1000) : esc(v); };
      h += '<div class="cols2">' + open.map(function (p) {
        var c = p.cur || {}, tone = /tránh|giảm|bán/i.test(c.a || "") ? "r" : /mua|tăng/i.test(c.a || "") ? "g" : "n";
        return '<section class="card"><div class="row"><b style="font-size:18px">' + esc(p.tk) + '</b><span class="tag ' + tone + '">' + esc(c.a || "") + '</span></div><div style="font-size:13.5px;margin-top:6px">' + esc(c.zone || "") + '</div><div class="sm mute" style="margin-top:3px">Mục tiêu ' + px(c.tgt) + " · cắt lỗ " + px(c.sl) + '</div><div class="g2" style="margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile"><div class="t">T+2</div><div class="n ' + cls(p.t2) + '">' + (p.t2 == null ? "–" : sg(p.t2, 1) + "%") + '</div></div><div class="tile"><div class="t">Đến nay</div><div class="n ' + cls(p.now) + '">' + (p.now == null ? "–" : sg(p.now, 1) + "%") + '</div></div><div class="tile"><div class="t">So VN-Index</div><div class="n ' + cls(p.alpha) + '">' + (p.alpha == null ? "–" : sg(p.alpha, 1)) + '</div></div></div><div class="sm mute" style="margin-top:6px">Từ ' + esc(dmy((p.start || [])[0])) + " · " + num(p.n_calls) + ' lần khuyến nghị</div><button class="ask" type="button" data-ask="Phân tích ' + esc(p.tk) + ': còn nên ' + esc(String(c.a || "").toLowerCase()) + ' không, vùng giá cần quan sát?">Hỏi TVN về ' + esc(p.tk) + " ›</button></section>";
      }).join("") + "</div>";
      if (done.length) h += '<section class="card" style="padding:4px 14px"><details><summary>Đã kết thúc · ' + done.length + ' vị thế</summary><div class="tw"><table class="t" style="margin-bottom:10px"><thead><tr><th>Mã</th><th>T+2</th><th>Đến lúc đóng</th><th>So VNI</th></tr></thead><tbody>' + done.map(function (p) { return "<tr><td><b>" + esc(p.tk) + '</b></td><td class="' + cls(p.t2) + '">' + (p.t2 == null ? "–" : sg(p.t2, 1) + "%") + '</td><td class="' + cls(p.now) + '">' + (p.now == null ? "–" : sg(p.now, 1) + "%") + '</td><td class="' + cls(p.alpha) + '">' + (p.alpha == null ? "–" : sg(p.alpha, 1)) + "</td></tr>"; }).join("") + "</tbody></table></div></details></section>";
      return '<div class="v">' + h + "</div>";
    });
  }

  /* ---------- điều hướng bằng #: nút Back của máy quay lại màn trước ---------- */
  function route() {
    var raw = (location.hash || "#homnay").slice(1), qi = raw.indexOf("?"), qs = qi >= 0 ? raw.slice(qi + 1) : "", parts = (qi >= 0 ? raw.slice(0, qi) : raw).split("/"), sec = parts[0] || "homnay", sub = parts[1] || "";
    var prev = route.sec; route.sec = sec + "/" + sub;
    document.documentElement.classList.remove("tvnqa-open");
    if (prev !== route.sec) window.scrollTo(0, 0);
    if (sec === "thitruong") return vMarket(sub, qs);
    if (sec === "bantin") return sub ? vReader(sub) : vNews();
    if (sec === "hoi") return vAsk(sub, qs);
    if (sec === "khuyennghi") return vReco();
    return vHome();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
