.pill{font-size:11px;font-weight:600;color:var(--navy);background:var(--gold2);border-radius:999px;padding:4px 9px;white-space:nowrap}
.ib{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#C9D4E8;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
#tick{display:flex;gap:16px;padding:7px 14px;background:#0F1B31;color:#fff;font-size:12px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#tick::-webkit-scrollbar{display:none}
#tick span i{font-style:normal;color:#9FB0CC}
#tick .r{color:#FF9B9B}#tick .g{color:#6FD49B}
#main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}

#bnav button,#rail .nv{appearance:none;border:0;background:none;cursor:pointer;color:#AEB9CF;font-weight:600}
#bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;font-size:10.5px;position:relative}

#bnav button[aria-current=page]::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold2)}
.v{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.hi{background:var(--cream);border-color:var(--creaml)}
.card.dk{background:var(--navy);border-color:var(--navy);color:#fff}
.lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--goldt)}
.dk .lab{color:var(--gold2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mute{color:var(--mute)}
.sm{font-size:12px}
.go{font-size:13px;font-weight:600;color:var(--navy);text-decoration:none;white-space:nowrap}
:root[data-theme=dark] .go{color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .go{color:var(--gold2)}}
a.card{display:block;text-decoration:none;color:inherit}
.hd{font-family:var(--fs);font-weight:700;line-height:1.35;font-size:17px;margin:8px 0 0}
h1.hd{font-size:23px;margin:4px 0 0}
.qi{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.qi+.qi{margin-top:9px}

.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}

.gauge{position:relative;height:10px;border-radius:5px;background:var(--chip);margin-top:6px;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0}
.gauge b{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--mute)}

.btn.pr{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.au{background:var(--gold);border-color:var(--gold);color:var(--navy)}

.dk .inp{border:0;background:#fff;color:#16213A}
.ask{margin-top:6px;min-height:36px;border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;text-align:left}

.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}

details>summary{cursor:pointer;list-style:none;font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:var(--mute)}details[open]>summary::after{content:"▴"}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{font-size:11.5px;color:var(--mute);font-weight:600}
table.t td:first-child,table.t th:first-child{text-align:left}
.frm{width:100%;border:0;display:block;min-height:70vh;background:transparent;border-radius:12px}
.foot{font-size:12px;color:var(--mute);line-height:1.6;padding:18px 2px 0;border-top:1px solid var(--line);margin-top:6px}
.foot b{color:var(--ink)}
.skel{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.err{padding:14px;border-radius:12px;background:var(--chip);font-size:14px}
img.ch{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;margin-top:10px}
.split{display:flex;flex-direction:column;gap:12px}
.rr{display:flex;flex-direction:column;gap:12px}
#tvnqa-b{display:none!important}
@media (min-width:1024px){

  #bnav{display:none}
  #top .lg{display:none}
  #main{padding:22px 28px 40px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
  .split>.l{display:flex;flex-direction:column;gap:12px;min-width:0}
  .rr{position:sticky;top:120px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seg{top:56px}
  .rd{max-width:820px}
}
.cols2{display:flex;flex-direction:column;gap:12px}
#back[hidden]{display:none}

  /* ---------- HỎI & PHÂN TÍCH ---------- */

  /* ---------- điều hướng bằng #: nút Back của máy quay lại màn trước ---------- */
