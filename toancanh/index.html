      h += T.card(T.h2("comp", "Nhiệt kế · Xu hướng", "La bàn chu kỳ · tuần kết thúc " + T.dmy(L.tuan_ket_thuc)) +
        '<div style="font-weight:700;font-size:1.02rem">' + T.esc(L.ket_luan || "") + "</div>" + meter(L.da, "Đà thị trường", L.da_tt) + meter(L.tam_ly, "Đám đông (đọc ngược chiều)", L.tam_ly_muc) +
        (wk.length ? '<div class="tw" style="margin-top:8px"><table class="tbl"><thead><tr><th>Tuần</th><th>VN-Index</th><th>Đà</th><th>Đám đông</th><th style="text-align:left">Trạng thái</th></tr></thead><tbody>' + wk.slice().reverse().map(function (w) {
          return "<tr><td>" + T.esc(T.dmy(w.tuan)) + "</td><td>" + T.n(w.vnindex, 2) + '</td><td class="' + T.cls(w.da) + '">' + T.sg(w.da, 0) + '</td><td class="' + T.cls(w.tam_ly) + '">' + T.sg(w.tam_ly, 0) + '</td><td style="text-align:left">' + T.esc(w.trang_thai || "") + (w.tin_hieu ? " · <b>" + T.esc(w.tin_hieu) + "</b>" : "") + "</td></tr>";
        }).join("") + "</tbody></table></div>" + '<div class="s mu" style="font-size:.74rem;margin-top:6px">VN-Index 6 tuần</div>' + sp : "") +
        (L.do_tin_cay ? '<p class="note">' + T.esc(L.do_tin_cay) + "</p>" : ""));
    }
    /* 4. Nhịp giảm gần nhất */
    var G = D.nhip_giam;
    if (G) h += T.card(T.h2("down", "Nhịp giảm gần nhất của VN-Index") + '<div class="grid2"><div class="tile"><div class="t">Đỉnh ' + T.esc(T.dmy(G.dinh)) + '</div><div class="v">' + T.n(G.vni_dinh, 2) + '</div></div><div class="tile"><div class="t">Đáy ' + T.esc(T.dmy(G.day)) + '</div><div class="v">' + T.n(G.vni_day, 2) + '</div><div class="d dn">' + T.sg(G.giam_pct, 1, "%") + "</div></div></div>" +
      '<p class="note">Bộ lọc "Khỏe trong nhịp giảm" đo từng mã trên đúng quãng này.</p>');
    /* 5. Ngành */
    var N = D.nganh || [];
    if (N.length) {
      var mxp = Math.max.apply(null, N.map(function (x) { return Math.abs(+x.pct || 0); }).concat([0.5]));
      h += T.card(T.h2("bars", "Ngành trong phiên", N.length + " ngành") + '<ul class="list">' + N.map(function (x) {
        var p = +x.pct || 0, w = Math.abs(p) / mxp * 50;
        return '<li><div class="h"><span>' + T.esc(x.ten) + '</span><span class="' + T.cls(p) + '">' + T.sg(p, 2, "%") + '</span></div><div class="bar" style="position:relative;margin-top:5px"><i style="position:absolute;top:0;bottom:0;' + (p >= 0 ? "left:50%" : "right:50%") + ";width:" + w + "%;background:" + (p >= 0 ? "var(--up)" : "var(--dn)") + '"></i></div><div class="s">' + T.n(x.gt, 1) + " tỷ · " + T.n(x.ty_trong, 1) + "% giá trị sàn · " + T.n(x.tang, 0) + " tăng, " + T.n(x.giam, 0) + " giảm / " + T.n(x.so_ma, 0) + " mã</div></li>";
      }).join("") + "</ul>");
    }
    /* 6. Bộ lọc cổ phiếu */
    var Q = D.quet || {}, keys = Object.keys(Q).filter(function (k) { return Q[k] && Q[k].cot; });
    if (keys.length) h += T.card(T.h2("filt", "Bộ lọc cổ phiếu", keys.length + " bộ lọc") + '<div class="chips" id="qg"></div><div class="chips" id="qk"></div><div id="qd" class="s" style="margin:-2px 0 8px;color:var(--mute);font-size:.8rem"></div><div class="tw"><table class="tbl" id="qt"></table></div>' +
      '<p class="note">Giá tính bằng nghìn đồng. Chỉ xét mã có giá trị giao dịch từ ' + T.n(D.min_gt || 10, 0) + " tỷ đồng mỗi phiên. Đây là bộ lọc số liệu, không phải khuyến nghị mua bán.</p>", "loc");
    h += '<div class="foot">Số liệu do TVN tổng hợp tự động sau phiên từ dữ liệu giao dịch HOSE; phân loại theo quy tắc, không dùng AI.</div>';
    M.innerHTML = h;

    if (keys.length) {
      var groups = [];
      keys.forEach(function (k) { var g = Q[k].nhom || "Khác"; if (groups.indexOf(g) < 0) groups.push(g); });
      var qg = document.getElementById("qg"), qk = document.getElementById("qk"), qd = document.getElementById("qd"), qt = document.getElementById("qt");
      var showK = function (k) {
        var L = Q[k], cot = L.cot || [], rows = L.dong || [];
        qd.textContent = (L.mo_ta || "") + (L.so_ma != null ? " Có " + L.so_ma + " mã" + (L.so_ma > rows.length ? ", hiện " + rows.length + " mã đầu." : ".") : "");
        if (!rows.length) { qt.innerHTML = '<tbody><tr><td class="mu" style="text-align:left;position:static">Phiên này không có mã nào.</td></tr></tbody>'; return; }
        qt.innerHTML = "<thead><tr>" + cot.map(function (c) { return "<th" + (c === "nganh" ? ' style="text-align:left"' : "") + ">" + T.esc(NHAN[c] || c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + cot.map(function (c, i) { return c === "nganh" ? '<td class="ng" title="' + T.esc(r[i]) + '">' + T.esc(r[i]) + "</td>" : c === "ma" ? "<td><b>" + T.esc(r[i]) + "</b></td>" : "<td>" + o(c, r[i]) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
      };
      var showG = function (g) {
        var ks = keys.filter(function (k) { return (Q[k].nhom || "Khác") === g; });
        T.tabs(qk, ks.map(function (k) { return [k, Q[k].ten + (Q[k].so_ma != null ? " (" + Q[k].so_ma + ")" : "")]; }), ks[0], showK);
        showK(ks[0]);
      };
      T.tabs(qg, groups.map(function (g) { return [g, g]; }), groups[0], showG);
      showG(groups[0]);
    }
  }
})();
</script><script src="../gate.js"></script><!--tvn-brand--><!--tvn-qa--><script defer src="../qa/qa.js"></script></body></html>
